name = "survey"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

[vars]
# DATABASE_URL duoc inject tu Variables and Secrets tren Cloudflare Pages khi deploy
ADMIN_USER = "admin"
ADMIN_PASS = "admin123"

# R2 Binding cho chuc nang dinh kem anh (tao bucket ten chinh xac "imagesurvey" truoc khi deploy)
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "imagesurvey"
